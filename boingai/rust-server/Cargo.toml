[package]
name = "boingai-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# none
